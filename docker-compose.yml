# Deploy na VPS compartilhada (Locaweb): o Traefik do stack `evolution-stack`
# já ocupa 80/443 e emite o HTTPS; este serviço só entra na rede dele com labels.
services:
  app:
    image: nutrivvo-app:latest
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
        # Vazio (padrão) mantém "WhatsApp em breve" no app; preencher liga o botão de conectar.
        VITE_WHATSAPP_BOT_NUMBER: ${VITE_WHATSAPP_BOT_NUMBER:-}
    container_name: nutrivvo-app
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    restart: unless-stopped
    mem_limit: 320m
    # Só no loopback do host: permite testar /health na VPS antes do DNS mudar.
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=evolution-stack_web
      - traefik.http.services.nutrivvo.loadbalancer.server.port=3000
      - traefik.http.middlewares.nutrivvo-www-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.nutrivvo-www-redirect.redirectregex.regex=^https://www\.nutrivvo\.com\.br/(.*)
      - traefik.http.middlewares.nutrivvo-www-redirect.redirectregex.replacement=https://nutrivvo.com.br/$${1}
      - traefik.http.routers.nutrivvo.rule=Host(`nutrivvo.com.br`)
      - traefik.http.routers.nutrivvo.entrypoints=websecure
      - traefik.http.routers.nutrivvo.tls.certresolver=letsencrypt
      - traefik.http.routers.nutrivvo.service=nutrivvo
      - traefik.http.routers.nutrivvo-www.rule=Host(`www.nutrivvo.com.br`)
      - traefik.http.routers.nutrivvo-www.entrypoints=websecure
      - traefik.http.routers.nutrivvo-www.tls.certresolver=letsencrypt
      - traefik.http.routers.nutrivvo-www.middlewares=nutrivvo-www-redirect
      - traefik.http.routers.nutrivvo-www.service=nutrivvo

networks:
  web:
    external: true
    name: evolution-stack_web
