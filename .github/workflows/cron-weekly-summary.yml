name: Resumo semanal (Telegram)

# Roda 1x/semana - Vercel Hobby só permite Cron Jobs nativos 1x/dia por
# projeto (mesmo motivo do cron-reminders.yml existir).
on:
  schedule:
    - cron: '0 12 * * 1' # Toda segunda, 12:00 UTC = 09:00 horário de Brasília
  workflow_dispatch: {}

jobs:
  trigger-weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Chama /api/cron-weekly-summary
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "https://nutrivvo.com.br/api/cron-weekly-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::cron-weekly-summary retornou status $status"
            exit 1
          fi
