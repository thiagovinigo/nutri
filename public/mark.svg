<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3949ab"/>
    </linearGradient>
  </defs>
  <!-- Mesma geometria do "N" de public/logo-full.svg, isolada sem o
       fundo escuro nem o texto "utrivvo" — pra uso como icone/mark
       standalone (navbar da landing, etc). -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="22" height="120" rx="6" fill="url(#ng)"/>
    <rect x="98" y="0" width="22" height="120" rx="6" fill="url(#ng)"/>
    <polygon points="22,4 62,4 120,116 80,116" fill="url(#ng)"/>
  </g>
</svg>
